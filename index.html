<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101e34">
  <title>万剑归宗</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="viewport" aria-label="万剑归宗战场">
    <div id="stage">
      <div class="backdrop" aria-hidden="true"></div>
      <svg id="road" viewBox="0 0 941 1672" aria-hidden="true"></svg>
      <div id="spawn" class="landmark spawn">入阵</div>
      <div id="goal" class="landmark goal">护山阵眼</div>
      <div id="swords" role="group" aria-label="剑阵"></div>
      <canvas id="motion" width="941" height="1672" aria-hidden="true"></canvas>
      <header class="hud">
        <h1>万剑归宗<i aria-hidden="true">御<br>剑</i></h1>
        <div class="progress ornament"><span id="level">第 1 关</span><i aria-hidden="true">✦</i><span id="wave">波次 1/3</span></div>
        <button id="pause" aria-label="暂停"><i aria-hidden="true"></i><i aria-hidden="true"></i></button>
        <div class="health ornament">
          <span>护山防线</span>
          <div id="health-meter" role="meter" aria-label="护山防线生命" aria-valuemin="0"><i></i></div>
          <b id="health"></b>
        </div>
      </header>
      <div id="combo" aria-hidden="true" hidden></div>
      <div id="blocked-label" class="sword-label" hidden>被阻挡</div>
      <div id="blocker-label" class="sword-label" hidden>挡路飞剑</div>
      <aside id="guide" class="guide ornament" aria-live="polite">
        <span id="step"></span><b id="instruction"></b>
      </aside>
      <footer class="tools">
        <svg viewBox="0 0 941 270" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="silk" x2=".8" y2="1"><stop stop-color="#51789b"/><stop offset=".28" stop-color="#203b61"/><stop offset=".71" stop-color="#172a46"/><stop offset="1" stop-color="#315c80"/></linearGradient>
          <linearGradient id="gold" x2=".8" y2=".9"><stop stop-color="#83562a"/><stop offset=".33" stop-color="#ffe7a9"/><stop offset=".61" stop-color="#946239"/><stop offset="1" stop-color="#edd297"/></linearGradient></defs>
          <path fill="url(#silk)" stroke="url(#gold)" stroke-width="4" d="M-8 100 Q75 48 150 72 Q231 75 296 45 Q349 13 420 21 Q503 19 559 10 Q647 3 703 46 Q754 86 827 75 Q894 67 953 107 L953 281H-8Z"/>
          <path fill="none" stroke="url(#gold)" stroke-width="3" d="M-8 117 Q90 68 168 86 Q229 88 317 47 Q355 29 388 39 M554 27 Q642 2 703 59 Q750 93 821 88 Q897 81 953 121 M-12 232Q96 178 203 215Q257 242 154 248Q96 251 94 233Q105 224 150 232 M953 220Q858 185 758 214Q686 246 788 249Q842 249 844 234Q832 226 801 233"/>
        </svg>
        <button id="talisman" aria-pressed="false" aria-label="破阵符">
          <span class="talisman-icon" aria-hidden="true"><img src="./assets/talisman.webp" alt=""></span>
          <span class="talisman-caption ornament"><span id="talisman-text">破阵符</span><b id="charges"></b></span>
        </button>
      </footer>
      <section id="overlay" aria-modal="true" role="dialog" aria-labelledby="dialog-title">
        <div class="dialog">
          <p id="dialog-kicker"></p>
          <h2 id="dialog-title"></h2>
          <p id="dialog-message"></p>
          <dl id="result" hidden></dl>
          <div class="dialog-actions">
            <button id="primary" class="ornament"></button>
            <button id="restart" class="ornament">重新挑战</button>
            <button id="home" class="ornament">返回山门</button>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
